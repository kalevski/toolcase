name: webmail

on:
  push:
    branches: [main]
    paths: ['webmail/**', '.github/workflows/webmail.yml']
  pull_request:
    paths: ['webmail/**', '.github/workflows/webmail.yml']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/webmail

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webmail/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webmail/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: webmail-dist
          path: webmail/internal/web/dist
          include-hidden-files: true

  go:
    runs-on: ubuntu-latest
    needs: web
    defaults:
      run:
        working-directory: webmail
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: webmail/go.mod
          cache-dependency-path: webmail/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: webmail-dist
          path: webmail/internal/web/dist
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...
      - name: go build
        run: CGO_ENABLED=0 go build ./...
      - name: smoke (fake platform + fake JMAP)
        run: test/smoke.sh
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          provenance: true
          sbom: true
          context: webmail
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=webmail
          cache-to: type=gha,scope=webmail,mode=max
