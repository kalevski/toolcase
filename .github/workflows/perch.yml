name: perch

on:
  push:
    branches: [main, 'feature/static-host']
    # the image bundles built @toolcase/base + web-components, so changes there
    # must rebuild perch too (build context is the repo root).
    paths:
      - 'perch/**'
      - 'base/**'
      - 'web-components/**'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/perch.yml'
  pull_request:
    paths:
      - 'perch/**'
      - 'base/**'
      - 'web-components/**'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/perch.yml'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/perch

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # repo root: perch's @toolcase/* deps are file:../ workspace
          # siblings, so the build needs the whole monorepo (see perch/Dockerfile).
          context: .
          file: perch/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=perch
          cache-to: type=gha,scope=perch,mode=max
