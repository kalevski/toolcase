name: Deploy Quaykeeper Landing to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'quaykeeper-landing/**'
      - 'package-lock.json'
      - '.github/workflows/deploy-quaykeeper-landing.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build quaykeeper-landing
        run: npm -w @toolcase/quaykeeper-landing run build

      - name: Deploy to public branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: 'quaykeeper-landing/out'
          branch: public/quaykeeper
          single-commit: true
