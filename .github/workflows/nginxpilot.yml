name: nginxpilot

on:
  push:
    branches: [main]
    # The image bundles certbot-dns-zonewright, so a plugin change rebuilds it.
    paths: ['nginxpilot/**', 'zonewright/certbot-dns-zonewright/**', '.github/workflows/nginxpilot.yml']
  pull_request:
    paths: ['nginxpilot/**', 'zonewright/certbot-dns-zonewright/**', '.github/workflows/nginxpilot.yml']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/nginxpilot

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nginxpilot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: nginxpilot/go.mod
          cache-dependency-path: nginxpilot/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      # certbot must see the zonewright DNS plugin in the image that ships.
      - name: Smoke test (certbot-dns-zonewright is installed)
        uses: docker/build-push-action@v6
        with:
          context: nginxpilot
          build-contexts: certbot-dns-zonewright=zonewright/certbot-dns-zonewright
          platforms: linux/amd64
          load: true
          tags: nginxpilot:smoke
          cache-from: type=gha,scope=nginxpilot
      - run: docker run --rm --entrypoint certbot nginxpilot:smoke plugins | grep -q '^\* dns-zonewright$'

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          provenance: true
          sbom: true
          context: nginxpilot
          build-contexts: certbot-dns-zonewright=zonewright/certbot-dns-zonewright
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=nginxpilot
          cache-to: type=gha,scope=nginxpilot,mode=max
