name: imagewarden

on:
  push:
    branches: [main]
    paths: ['imagewarden/**', '.github/workflows/imagewarden.yml']
  pull_request:
    paths: ['imagewarden/**', '.github/workflows/imagewarden.yml']

permissions:
  contents: read
  packages: write # only the docker job pushes; kept top-level as the other product workflows do

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/imagewarden

jobs:
  # ── Fast lane: vet/build/test of the whole tree, no libonnxruntime.so ──────
  # Decision (spec §11, §4): this job builds/tests every package with `./...`,
  # including internal/model, with CGO **enabled** (the default; ubuntu-latest
  # ships gcc). The ONNX Runtime binding (github.com/yalue/onnxruntime_go) is a
  # cgo package — under CGO_ENABLED=0 build constraints exclude all its Go files
  # and the whole tree fails to compile, since classify/api/cmd transitively
  # import internal/model. This matches production: the Dockerfile builds the
  # binary with CGO_ENABLED=1.
  #
  # What keeps this lane "fast" is that no libonnxruntime.so is needed: the
  # binding vendors the ORT C API header and dlopens the .so only at runtime via
  # SetSharedLibraryPath, and a real session is only built when a *model.Model
  # is constructed — which the default suite never does; it stands in a fake
  # Classifier. The ONE thing that needs the real .so is the `//go:build ort`
  # test (internal/model/model_ort_test.go), which the untagged suite never
  # compiles — that lives in the separate ort-test job below.
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imagewarden
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: imagewarden/go.mod
          cache-dependency-path: imagewarden/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build (whole tree)
        run: go build ./...

      - name: go test (default suite; no libonnxruntime.so needed)
        run: go test ./...

  # ── ORT / binding version-mismatch gate (spec §3.4, §11) ───────────────────
  # Runs the `//go:build ort` accuracy smoke test where a real libonnxruntime.so
  # is present. This is the job that fails loudly if ORT_VERSION / ORT_SHA256 and
  # the github.com/yalue/onnxruntime_go pin drift apart: the binding dlopens the
  # .so and exercises a real session, so a load/Run error surfaces here in
  # model_ort_test.go rather than in production.
  ort-test:
    runs-on: ubuntu-latest
    container: golang:1.24-bookworm # glibc + the pinned Go toolchain, matching the build stage
    env:
      # SINGLE SOURCE OF TRUTH — these MUST equal the Dockerfile's ARG ORT_VERSION
      # and the amd64 (x64) `ADD --checksum` (imagewarden/Dockerfile, task 032).
      # GitHub Actions env cannot be shared with a Dockerfile ARG / ADD --checksum,
      # so they are kept in lockstep by convention: whoever locks ORT_VERSION fills
      # both the Dockerfile checksums and ORT_SHA256 here in the same change.
      ORT_VERSION: "1.20.1"
      # TODO(032): fill in the real sha256 of onnxruntime-linux-x64-1.20.1.tgz —
      # it must match the Dockerfile's `ADD --checksum=sha256:...` for the x64
      # tarball, which is still "<FILL IN CI — amd64 tarball>". Keep both in sync.
      ORT_SHA256: "<FILL IN CI — amd64 tarball; must match Dockerfile x64 ADD --checksum>"
    steps:
      - uses: actions/checkout@v4 # model/model.onnx (task 029) is a plain git blob; Load verifies its sha256

      - name: Fetch + verify pinned ONNX Runtime
        working-directory: imagewarden
        run: |
          set -euo pipefail
          url="https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          curl -fsSL "$url" -o /tmp/ort.tgz
          echo "${ORT_SHA256}  /tmp/ort.tgz" | sha256sum -c -
          mkdir -p /opt/ort && tar -xzf /tmp/ort.tgz -C /opt/ort --strip-components=1

      - name: go test (ort tag) against the real session
        working-directory: imagewarden
        env:
          ORT_DYLIB_PATH: /opt/ort/lib/libonnxruntime.so
        run: CGO_ENABLED=1 go test -tags ort ./internal/model

  # ── Container image (multi-arch) ───────────────────────────────────────────
  # Mirrors nginxpilot's docker job, retargeted to imagewarden and extended for
  # multi-arch: the Dockerfile's ORT stage selects the tarball by TARGETARCH
  # (amd64->x64, arm64->aarch64, task 032 / spec §9), so both platforms build
  # from the same Dockerfile. QEMU provides the arm64 emulation.
  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4 # model/ is baked into the image (§9)

      - uses: docker/setup-qemu-action@v3 # arm64 emulation for the multi-arch build

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: imagewarden
          platforms: linux/amd64,linux/arm64 # ORT stage is TARGETARCH-parameterized (§9, task 032)
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=imagewarden
          cache-to: type=gha,scope=imagewarden,mode=max

  # ── Container smoke test (spec §9 hardened-runtime contract) ────────────────
  # Verifies the built image actually satisfies the strong runtime claims spec §9
  # makes — distroless (no shell), nonroot, boots under `--read-only --cap-drop
  # ALL`, self-probing HEALTHCHECK, entrypoint-as-CLI passthrough, and the §5 HTTP
  # response shape. This is the integration counterpart to the unit suite in
  # `build`: it runs the real binary inside the real image (task 035).
  #
  # smoke.sh does its own single-arch `docker build` (host amd64), so no separate
  # buildx `--load` step is needed here — QEMU-emulated arm64 is far too slow for a
  # boot test, so the multi-arch build/push stays in the `docker` job above.
  # `needs: build` gates on the fast lane; jq + curl are preinstalled on
  # ubuntu-latest.
  smoke:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4 # model baked into the image (§9)

      - name: Run container smoke test
        run: bash imagewarden/tools/smoke.sh
