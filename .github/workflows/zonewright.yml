name: zonewright

on:
  push:
    branches: [main]
    paths: ['zonewright/**', '.github/workflows/zonewright.yml']
  pull_request:
    paths: ['zonewright/**', '.github/workflows/zonewright.yml']

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/zonewright

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zonewright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: zonewright/go.mod
          cache-dependency-path: zonewright/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

  e2e:
    # Two containers with real BIND: replication, partition + heal, restart.
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Install dig
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Two-server cluster end-to-end test
        run: zonewright/test/e2e-cluster.sh

  docker:
    runs-on: ubuntu-latest
    needs: [build, e2e]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: zonewright
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=zonewright
          cache-to: type=gha,scope=zonewright,mode=max
