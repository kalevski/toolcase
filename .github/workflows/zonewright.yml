name: zonewright

on:
  push:
    branches: [main]
    paths: ['zonewright/**', '.github/workflows/zonewright.yml']
  pull_request:
    paths: ['zonewright/**', '.github/workflows/zonewright.yml']

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/zonewright

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zonewright
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: zonewright/go.mod
          cache-dependency-path: zonewright/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: go build
        run: CGO_ENABLED=0 go build ./...

  certbot-plugin:
    # certbot-dns-zonewright unit tests (a fake zonewright over HTTP).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zonewright/certbot-dns-zonewright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[test]'
      - name: pytest
        run: pytest -q tests

  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          provenance: true
          sbom: true
          context: zonewright
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha,scope=zonewright
          cache-to: type=gha,scope=zonewright,mode=max
