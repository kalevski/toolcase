<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1600" viewBox="0 0 1200 1600">
    <defs>
        <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
            <path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity="0.16" stroke-width="1"/>
        </pattern>
        <pattern id="dots" width="96" height="96" patternUnits="userSpaceOnUse">
            <circle cx="24" cy="24" r="1.6" fill="#ffffff" fill-opacity="0.35"/>
            <circle cx="72" cy="72" r="1.6" fill="#ffffff" fill-opacity="0.2"/>
        </pattern>
        <radialGradient id="glowTop" cx="18%" cy="12%" r="55%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="glowBottom" cx="85%" cy="92%" r="65%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
            <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
        </linearGradient>
    </defs>

    <rect width="1200" height="1600" fill="url(#grid)"/>
    <rect width="1200" height="1600" fill="url(#dots)"/>
    <rect width="1200" height="1600" fill="url(#glowTop)"/>
    <rect width="1200" height="1600" fill="url(#glowBottom)"/>
    <rect width="1200" height="1600" fill="url(#beam)"/>

    <!-- a few oversized ghost rings for depth -->
    <circle cx="180" cy="260" r="220" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
    <circle cx="180" cy="260" r="140" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1"/>
    <circle cx="1050" cy="1350" r="320" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <circle cx="1050" cy="1350" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
    <circle cx="980" cy="240" r="90" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>

    <!-- scattered plus marks -->
    <g stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5">
        <path d="M300 620h16M308 612v16"/>
        <path d="M840 480h16M848 472v16"/>
        <path d="M520 1080h16M528 1072v16"/>
        <path d="M960 860h16M968 852v16"/>
        <path d="M160 1240h16M168 1232v16"/>
    </g>
</svg>
