# Silent catch-all — replaces the stock nginx welcome page. A request for a
# host no resource claims gets the connection closed (444) with no response
# bytes, so an unconfigured server looks like nothing is hosted there.
#
# The one exception is /.well-known/acme-challenge/, served from the shared
# ACME webroot so HTTP-01 challenges can validate a domain before any vhost
# for it exists (acme.http.webroot defaults to /var/www/acme in the image).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 444;
    }
}

# Unmatched TLS: reject the handshake outright — no certificate is presented
# and nothing identifiable is sent back.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}
