services:
    ai-task-manager:
        build: .
        ports:
            - '3000:3000'
        environment:
            GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
            GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
            OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI}
            AUTH_SECRET: ${AUTH_SECRET}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
            WORKSPACE_DIR: /workspace
            DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-6}
            GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-ai-task-manager}
            GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-bot@ai-task-manager.local}
            GIT_REMOTE_TOKEN: ${GIT_REMOTE_TOKEN:-} # for `git push`; or mount an SSH key instead
            # GITHUB_ALLOWED_LOGINS: ${GITHUB_ALLOWED_LOGINS:-}
            # GITHUB_ALLOWED_ORG: ${GITHUB_ALLOWED_ORG:-}
            # SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
        volumes:
            # the ONLY persistent state: repos + tasks + skills + logs + .auth
            - /srv/ai-task-manager/workspace:/workspace
            # alternative push credential — mount an SSH deploy key and set GIT_SSH_CONFIGURED=1:
            # - ~/.ssh/deploy_key:/home/app/.ssh/id_ed25519:ro
        restart: unless-stopped
