<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fantasy Game UI Components</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="fantasy.css" />
<style>
  body { background: #0a0604; margin: 0; }
  @keyframes fg-pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  @keyframes fg-blink { 50% { opacity: 0 } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="fg-primitives.jsx"></script>
<script type="text/babel" src="fg-hud.jsx"></script>
<script type="text/babel" src="fg-menus.jsx"></script>
<script type="text/babel" src="fg-inventory.jsx"></script>
<script type="text/babel" src="fg-progression.jsx"></script>

<script type="text/babel" data-presets="env,react">
const {
  DesignCanvas, DCSection, DCArtboard,
  Panel, Eyebrow, Title, Divider, ResourceBar, ItemSlot, Key, Toggle, Check, Slider,
  Portrait, BuffIcon, ArtboardBackdrop,
  PlayerFrame, Hotbar, BuffBar, Minimap, QuestTracker,
  Crosshair, KillFeed, FloatingDamage, InteractPrompt, CompassStrip,
  MainMenu, PauseMenu, ConfirmDialog, DialogueBox, LoadingScreen, GameOverScreen, SaveSlots,
  ItemTooltip, InventoryGrid, Paperdoll, ShopPanel,
  SkillTree, LevelHeader, PartyPanel, SettingsPanel, KeyBindList,
  AchievementToast, BossBar, ChatWindow, RadialWheel, Subtitle,
} = window;

// Wrap a component so the artboard has consistent dark scene padding
const Frame = ({ children, kind = "scene", padding = 32, align = "center" }) => (
  <ArtboardBackdrop kind={kind} style={{
    padding,
    display: "flex", alignItems: align, justifyContent: "center",
  }}>
    {children}
  </ArtboardBackdrop>
);

const App = () => (
  <DesignCanvas
    title="Emberfall — Fantasy Game UI"
    subtitle="Original components in a gilded-parchment, runic aesthetic. Inspired by classic ARPG / soulslike conventions."
  >
    <DCSection id="hud" title="In-Game HUD">
      <DCArtboard id="player-frame"   label="Player Frame"      width={400} height={140}>
        <Frame padding={20}><PlayerFrame /></Frame>
      </DCArtboard>
      <DCArtboard id="hotbar"         label="Hotbar / Action Bar" width={680} height={120}>
        <Frame><Hotbar /></Frame>
      </DCArtboard>
      <DCArtboard id="boss-bar"       label="Boss Bar"          width={700} height={170}>
        <Frame><BossBar /></Frame>
      </DCArtboard>
      <DCArtboard id="buffs"          label="Buff &amp; Debuff Tray" width={300} height={170}>
        <Frame padding={16}><BuffBar /></Frame>
      </DCArtboard>
      <DCArtboard id="minimap"        label="Minimap"           width={280} height={290}>
        <Frame padding={16}><Minimap /></Frame>
      </DCArtboard>
      <DCArtboard id="compass"        label="Compass Strip"     width={440} height={100}>
        <Frame><CompassStrip /></Frame>
      </DCArtboard>
      <DCArtboard id="quest-tracker"  label="Quest Tracker"     width={360} height={240}>
        <Frame padding={20}><QuestTracker /></Frame>
      </DCArtboard>
      <DCArtboard id="kill-feed"      label="Kill / Event Feed" width={340} height={200}>
        <Frame><KillFeed /></Frame>
      </DCArtboard>
      <DCArtboard id="crosshair"      label="Reticle"           width={200} height={200}>
        <Frame><Crosshair /></Frame>
      </DCArtboard>
      <DCArtboard id="floating-damage" label="Floating Damage Numbers" width={520} height={160}>
        <Frame><FloatingDamage /></Frame>
      </DCArtboard>
      <DCArtboard id="interact"       label="Interact Prompt"   width={400} height={100}>
        <Frame><InteractPrompt /></Frame>
      </DCArtboard>
      <DCArtboard id="subtitle"       label="Subtitle / Caption" width={620} height={140}>
        <Frame><Subtitle /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="menus" title="Menus &amp; Dialogs">
      <DCArtboard id="main-menu"      label="Main Menu / Title" width={580} height={680}>
        <Frame padding={30}><MainMenu /></Frame>
      </DCArtboard>
      <DCArtboard id="pause-menu"     label="Pause Menu"        width={420} height={420}>
        <Frame padding={20}><PauseMenu /></Frame>
      </DCArtboard>
      <DCArtboard id="dialogue"       label="Dialogue Box"      width={780} height={380}>
        <Frame><DialogueBox /></Frame>
      </DCArtboard>
      <DCArtboard id="confirm"        label="Confirm Dialog"    width={440} height={300}>
        <Frame><ConfirmDialog /></Frame>
      </DCArtboard>
      <DCArtboard id="loading"        label="Loading Screen"    width={760} height={440}>
        <Frame padding={20}><LoadingScreen /></Frame>
      </DCArtboard>
      <DCArtboard id="gameover"       label="Game Over"         width={540} height={360}>
        <Frame><GameOverScreen /></Frame>
      </DCArtboard>
      <DCArtboard id="saves"          label="Save Slots"        width={600} height={440}>
        <Frame padding={20}><SaveSlots /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="inventory" title="Inventory &amp; Items">
      <DCArtboard id="inv-grid"       label="Inventory Grid"    width={440} height={520}>
        <Frame padding={20}><InventoryGrid /></Frame>
      </DCArtboard>
      <DCArtboard id="paperdoll"      label="Equipment / Paperdoll" width={380} height={620}>
        <Frame padding={20}><Paperdoll /></Frame>
      </DCArtboard>
      <DCArtboard id="tooltip"        label="Item Tooltip"      width={340} height={420}>
        <Frame padding={20}><ItemTooltip /></Frame>
      </DCArtboard>
      <DCArtboard id="shop"           label="Shop / Vendor"     width={520} height={580}>
        <Frame padding={20}><ShopPanel /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="progression" title="Progression &amp; Social">
      <DCArtboard id="skill-tree"     label="Skill / Talent Tree" width={520} height={520}>
        <Frame padding={20}><SkillTree /></Frame>
      </DCArtboard>
      <DCArtboard id="level-header"   label="Level / XP Header" width={480} height={140}>
        <Frame padding={20}><LevelHeader /></Frame>
      </DCArtboard>
      <DCArtboard id="party"          label="Party Panel"       width={340} height={340}>
        <Frame padding={20}><PartyPanel /></Frame>
      </DCArtboard>
      <DCArtboard id="achievement"    label="Achievement Toast" width={440} height={140}>
        <Frame padding={20}><AchievementToast /></Frame>
      </DCArtboard>
      <DCArtboard id="chat"           label="Chat Window"       width={440} height={300}>
        <Frame padding={20}><ChatWindow /></Frame>
      </DCArtboard>
      <DCArtboard id="radial"         label="Radial / Ping Wheel" width={340} height={340}>
        <Frame><RadialWheel /></Frame>
      </DCArtboard>
    </DCSection>

    <DCSection id="settings" title="Settings &amp; Controls">
      <DCArtboard id="settings"       label="Settings Panel"    width={540} height={620}>
        <Frame padding={20}><SettingsPanel /></Frame>
      </DCArtboard>
      <DCArtboard id="keybinds"       label="Key Bindings"      width={420} height={500}>
        <Frame padding={20}><KeyBindList /></Frame>
      </DCArtboard>
    </DCSection>
  </DesignCanvas>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
