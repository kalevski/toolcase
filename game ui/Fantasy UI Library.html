<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Fantasy UI — Component Library</title>
<link rel="stylesheet" href="colors_and_type.css" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="fantasy.css" />
<style>
  body { background: #0a0604; margin: 0; }
  @keyframes fg-pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.4 } }
  @keyframes fg-blink { 50% { opacity: 0 } }

  .lib-page {
    max-width: 1400px;
    margin: 0 auto;
    padding: 60px 40px 100px;
    color: var(--fg-parch);
  }
  .lib-hero {
    text-align: center;
    padding: 40px 20px 60px;
    border-bottom: 1px solid rgba(201,169,97,0.2);
    margin-bottom: 60px;
  }
  .lib-hero h1 {
    font-family: var(--fg-display);
    font-size: 56px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--fg-gold-bright);
    text-shadow: 0 2px 0 #000, 0 0 32px rgba(232, 200, 120, 0.35);
    margin: 12px 0 8px;
  }
  .lib-hero .lib-eyebrow {
    font-family: var(--fg-display);
    font-size: 13px;
    letter-spacing: 0.5em;
    color: var(--fg-parch-dim);
    text-transform: uppercase;
  }
  .lib-hero p {
    font-family: var(--fg-body);
    font-style: italic;
    color: var(--fg-parch-3);
    font-size: 16px;
    max-width: 520px;
    margin: 8px auto;
  }
  .lib-section { margin-bottom: 80px; }
  .lib-section-head {
    display: flex; align-items: baseline; gap: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--fg-gold-deep);
    margin-bottom: 32px;
  }
  .lib-section-head .num {
    font-family: var(--fg-display); font-size: 14px;
    letter-spacing: 0.3em; color: var(--fg-gold-deep);
  }
  .lib-section-head h2 {
    font-family: var(--fg-display); font-weight: 700;
    font-size: 28px; letter-spacing: 0.08em;
    color: var(--fg-gold-bright);
    margin: 0;
  }
  .lib-section-head .sub {
    margin-left: auto;
    font-family: var(--fg-body); font-style: italic;
    color: var(--fg-parch-3); font-size: 14px;
  }

  .lib-tile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 16px;
  }
  .lib-tile {
    background: linear-gradient(180deg, #14100a 0%, #0a0604 100%);
    border: 1px solid rgba(201,169,97,0.25);
    padding: 0;
    display: flex; flex-direction: column;
    min-height: 200px;
  }
  .lib-tile-body {
    flex: 1;
    padding: 24px;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(60% 50% at 50% 30%, rgba(201,169,97,0.04), transparent 70%);
    overflow: hidden;
  }
  .lib-tile.is-wide { grid-column: span 2; }
  .lib-tile.is-tall { min-height: 360px; }
  .lib-tile.is-xtall { min-height: 520px; }
  .lib-tile-foot {
    padding: 10px 14px;
    border-top: 1px solid rgba(201,169,97,0.2);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(0,0,0,0.4);
  }
  .lib-tile-foot .name {
    font-family: var(--fg-display);
    font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-gold-bright);
  }
  .lib-tile-foot .meta {
    font-family: var(--fg-mono);
    font-size: 10px; color: var(--fg-parch-3);
    letter-spacing: 0.14em; text-transform: uppercase;
  }

  .lib-toc {
    display: flex; flex-wrap: wrap; gap: 6px;
    justify-content: center;
    margin-top: 24px;
  }
  .lib-toc a {
    font-family: var(--fg-display); font-size: 11px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--fg-parch-3);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid rgba(201,169,97,0.25);
    transition: color 0.15s, border-color 0.15s;
  }
  .lib-toc a:hover { color: var(--fg-gold-bright); border-color: var(--fg-gold); }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="fg-primitives.jsx"></script>
<script type="text/babel" src="fg-atoms.jsx"></script>
<script type="text/babel" src="fg-hud.jsx"></script>
<script type="text/babel" src="fg-menus.jsx"></script>
<script type="text/babel" src="fg-inventory.jsx"></script>
<script type="text/babel" src="fg-progression.jsx"></script>

<script type="text/babel" data-presets="env,react">
const {
  Panel, Eyebrow, Title, Divider, ResourceBar, ItemSlot, Key, Toggle, Check, Slider,
  Portrait, BuffIcon,
  GildedFrame, RuneCorner, MetalButton, IconBadge, StatRow, TabBar, ListRow,
  ProgressArc, RarityChip, CurrencyChip, LoreText, PanelHeader, MenuItem, ScrollText,
  PlayerFrame, Hotbar, BuffBar, Minimap, QuestTracker,
  Crosshair, KillFeed, FloatingDamage, InteractPrompt, CompassStrip,
  MainMenu, PauseMenu, ConfirmDialog, DialogueBox, LoadingScreen, GameOverScreen, SaveSlots,
  ItemTooltip, InventoryGrid, Paperdoll, ShopPanel,
  SkillTree, LevelHeader, PartyPanel, SettingsPanel, KeyBindList,
  AchievementToast, BossBar, ChatWindow, RadialWheel, Subtitle,
} = window;

const Tile = ({ name, kind = "atom", wide, tall, xtall, scale, children }) => (
  <div className={`lib-tile ${wide ? "is-wide" : ""} ${tall ? "is-tall" : ""} ${xtall ? "is-xtall" : ""}`}>
    <div className="lib-tile-body">
      <div style={{ transform: scale ? `scale(${scale})` : "none", transformOrigin: "center" }}>
        {children}
      </div>
    </div>
    <div className="lib-tile-foot">
      <span className="name">{name}</span>
      <span className="meta">{kind}</span>
    </div>
  </div>
);

const Section = ({ id, num, title, sub, children }) => (
  <section id={id} className="lib-section">
    <div className="lib-section-head">
      <span className="num">{num}</span>
      <h2>{title}</h2>
      <span className="sub">{sub}</span>
    </div>
    <div className="lib-tile-grid">{children}</div>
  </section>
);

const App = () => (
  <div className="lib-page">
    <header className="lib-hero">
      <div className="lib-eyebrow">Hollow Crown · UI Codex</div>
      <h1>EMBERFALL</h1>
      <div className="fg-divider" style={{ maxWidth: 320, margin: "16px auto" }}>
        <div className="fg-diamond" />
      </div>
      <p>“A library of gilded atoms and the great instruments forged from them.”</p>
      <nav className="lib-toc">
        <a href="#atoms">Atoms</a>
        <a href="#hud">HUD</a>
        <a href="#menus">Menus</a>
        <a href="#inventory">Inventory</a>
        <a href="#progression">Progression</a>
        <a href="#settings">Settings</a>
      </nav>
    </header>

    <Section id="atoms" num="I" title="Atoms &amp; Building Blocks" sub="Reused inside every complex component">
      <Tile name="Panel" kind="frame">
        <Panel style={{ padding: 18, width: 200 }}>
          <Eyebrow>Eyebrow</Eyebrow>
          <Title size={16} style={{ marginTop: 4 }}>Gilded Frame</Title>
        </Panel>
      </Tile>
      <Tile name="Gilded Frame" kind="frame">
        <GildedFrame padding={16} style={{ width: 200 }}>
          <span style={{ fontFamily: "var(--fg-mono)", fontSize: 12, color: "var(--fg-parch-3)" }}>
            Bare bordered surface
          </span>
        </GildedFrame>
      </Tile>
      <Tile name="Rune Corners" kind="ornament">
        <div style={{ position: "relative", width: 140, height: 80, border: "1px solid var(--fg-gold-deep)", background: "#0e0905" }}>
          <RuneCorner at="tl" /><RuneCorner at="tr" />
          <RuneCorner at="bl" /><RuneCorner at="br" />
        </div>
      </Tile>
      <Tile name="Divider" kind="ornament">
        <div className="fg-divider" style={{ width: 240 }}><div className="fg-diamond" /></div>
      </Tile>
      <Tile name="Eyebrow + Title" kind="type">
        <div style={{ textAlign: "center" }}>
          <Eyebrow>Saga Records</Eyebrow>
          <Title size={20} style={{ marginTop: 6 }}>Load Saga</Title>
        </div>
      </Tile>
      <Tile name="Lore Text" kind="type">
        <LoreText style={{ maxWidth: 220, textAlign: "center" }}>
          “The crown was hollow long before the king’s neck cooled.”
        </LoreText>
      </Tile>

      <Tile name="Metal Button" kind="control">
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "center" }}>
          <MetalButton variant="primary">Begin</MetalButton>
          <MetalButton>Default</MetalButton>
          <MetalButton variant="ghost">Cancel</MetalButton>
          <MetalButton variant="danger">Forsake</MetalButton>
        </div>
      </Tile>
      <Tile name="Key Cap" kind="control">
        <div style={{ display: "flex", gap: 6 }}>
          <Key>E</Key><Key>Esc</Key><Key>Shift</Key><Key>M1</Key>
        </div>
      </Tile>
      <Tile name="Toggle / Check" kind="control">
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <Toggle on={true} /><Toggle on={false} />
          <Check on={true} /><Check on={false} />
        </div>
      </Tile>
      <Tile name="Slider" kind="control" wide>
        <div style={{ width: 320 }}>
          <Slider label="Master Volume" value={72} suffix="%" />
        </div>
      </Tile>
      <Tile name="Tab Bar" kind="control" wide>
        <TabBar tabs={["Buy", "Sell", "Repair", "Identify"]} active={0} />
      </Tile>

      <Tile name="Resource Bar" kind="display" wide>
        <div style={{ width: 320, display: "flex", flexDirection: "column", gap: 8 }}>
          <ResourceBar value={742} max={950}  kind="hp"      label="Vitae" />
          <ResourceBar value={310} max={520}  kind="mp"      label="Mana" />
          <ResourceBar value={88}  max={100}  kind="stamina" label="Vigor" />
          <ResourceBar value={4820} max={12000} kind="xp"    label="Lore" />
        </div>
      </Tile>
      <Tile name="Progress Arc" kind="display">
        <div style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <ProgressArc value={62} glyph="🔥" color="var(--fg-fire)" label="cooldown" />
          <ProgressArc value={84} color="var(--fg-mana-bright)" label="cast" />
        </div>
      </Tile>
      <Tile name="Item Slot · Rarities" kind="display" wide>
        <div style={{ display: "flex", gap: 8 }}>
          <ItemSlot glyph="⚔" rarity="common" />
          <ItemSlot glyph="🛡" rarity="uncommon" />
          <ItemSlot glyph="🏹" rarity="rare" />
          <ItemSlot glyph="✦" rarity="epic" />
          <ItemSlot glyph="👑" rarity="legendary" />
          <ItemSlot glyph="◉" rarity="mythic" />
        </div>
      </Tile>
      <Tile name="Item Slot · States" kind="display" wide>
        <div style={{ display: "flex", gap: 8 }}>
          <ItemSlot glyph="⚔" hotkey="1" rarity="rare" />
          <ItemSlot glyph="🔥" hotkey="2" rarity="legendary" cooldown={45} />
          <ItemSlot glyph="🧪" hotkey="Q" rarity="common" qty={12} />
          <ItemSlot glyph="✦" rarity="epic" locked />
          <ItemSlot hotkey="R" />
        </div>
      </Tile>
      <Tile name="Buff / Debuff Icon" kind="display">
        <div style={{ display: "flex", gap: 6 }}>
          <BuffIcon glyph="☆" time="2:14" kind="buff" />
          <BuffIcon glyph="✦" time="0:48" kind="buff" />
          <BuffIcon glyph="☠" time="0:08" kind="debuff" />
          <BuffIcon glyph="❄" time="0:03" kind="debuff" color="var(--fg-frost)" />
        </div>
      </Tile>
      <Tile name="Portrait Medallion" kind="display">
        <div style={{ display: "flex", gap: 14 }}>
          <Portrait glyph="A" size={56} level={47} />
          <Portrait glyph="◉" size={56} ring="var(--fg-legendary)" />
          <Portrait glyph="L" size={56} level={42} />
        </div>
      </Tile>
      <Tile name="Icon Badge" kind="display">
        <div style={{ display: "flex", gap: 8 }}>
          <IconBadge glyph="⚔" />
          <IconBadge glyph="✦" color="var(--fg-arcane-bright)" />
          <IconBadge glyph="🛡" />
          <IconBadge glyph="📜" color="var(--fg-stamina-bright)" />
        </div>
      </Tile>
      <Tile name="Rarity Chip" kind="meta">
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <RarityChip rarity="uncommon" />
          <RarityChip rarity="rare" />
          <RarityChip rarity="epic" />
          <RarityChip rarity="legendary" />
        </div>
      </Tile>
      <Tile name="Currency Chip" kind="meta">
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          <CurrencyChip glyph="◉" amount={4218} />
          <CurrencyChip glyph="◆" amount={24} color="var(--fg-arcane-bright)" />
          <CurrencyChip glyph="✦" amount={3} color="var(--fg-blood-bright)" />
        </div>
      </Tile>
      <Tile name="Stat Row" kind="display" wide>
        <div style={{ width: 280 }}>
          <StatRow label="Damage" value="184–212" trend={18} />
          <StatRow label="Crit"   value="14% / x2.4" />
          <StatRow label="Weight" value="9.4" trend={-2} />
        </div>
      </Tile>
      <Tile name="List Row" kind="display" wide>
        <div style={{ width: 320, background: "rgba(0,0,0,0.4)", border: "1px solid rgba(201,169,97,0.2)" }}>
          <ListRow selected>
            <span style={{ fontFamily: "var(--fg-display)", color: "var(--fg-gold)", fontSize: 13 }}>01</span>
            <span style={{ flex: 1, fontFamily: "var(--fg-body)" }}>Selected entry</span>
            <Key>↵</Key>
          </ListRow>
          <ListRow>
            <span style={{ fontFamily: "var(--fg-display)", color: "var(--fg-gold)", fontSize: 13 }}>02</span>
            <span style={{ flex: 1, fontFamily: "var(--fg-body)" }}>Hover entry</span>
          </ListRow>
        </div>
      </Tile>
      <Tile name="Menu Item" kind="display" wide>
        <div style={{ width: 240 }}>
          <MenuItem label="Continue" hotkey="↵" selected />
          <MenuItem label="New Game" />
          <MenuItem label="Settings" />
        </div>
      </Tile>
      <Tile name="Scroll Text" kind="display" wide>
        <div style={{ maxWidth: 360 }}>
          <ScrollText title="Wisdom of the road">
            Hold the parry stance through a heavy strike to riposte. The riposte cannot be blocked.
          </ScrollText>
        </div>
      </Tile>
      <Tile name="Floating Combat Number" kind="effect">
        <span style={{
          fontFamily: "var(--fg-display)", fontWeight: 700, fontSize: 28,
          color: "#ffd25a",
          textShadow: "0 1px 2px #000, 0 0 12px #ffd25a",
        }}>−312!</span>
      </Tile>
    </Section>

    <Section id="hud" num="II" title="In-Game HUD" sub="Live combat surfaces — built from the atoms above">
      <Tile name="Player Frame" kind="composite" wide><PlayerFrame /></Tile>
      <Tile name="Boss Bar" kind="composite" wide><BossBar /></Tile>
      <Tile name="Hotbar" kind="composite" wide><Hotbar /></Tile>
      <Tile name="Buff Tray" kind="composite" tall><BuffBar /></Tile>
      <Tile name="Minimap" kind="composite" tall><Minimap /></Tile>
      <Tile name="Quest Tracker" kind="composite" tall><QuestTracker /></Tile>
      <Tile name="Compass Strip" kind="composite" wide><CompassStrip /></Tile>
      <Tile name="Kill Feed" kind="composite"><KillFeed /></Tile>
      <Tile name="Reticle" kind="composite"><Crosshair /></Tile>
      <Tile name="Floating Damage" kind="composite" wide><FloatingDamage /></Tile>
      <Tile name="Interact Prompt" kind="composite" wide><InteractPrompt /></Tile>
      <Tile name="Subtitle" kind="composite" wide><Subtitle /></Tile>
    </Section>

    <Section id="menus" num="III" title="Menus &amp; Dialogs" sub="Front-of-house screens and modal flows">
      <Tile name="Main Menu" kind="composite" tall xtall scale={0.78}><MainMenu /></Tile>
      <Tile name="Pause Menu" kind="composite" tall scale={0.85}><PauseMenu /></Tile>
      <Tile name="Confirm Dialog" kind="composite" tall><ConfirmDialog /></Tile>
      <Tile name="Dialogue Box" kind="composite" wide tall scale={0.78}><DialogueBox /></Tile>
      <Tile name="Loading Screen" kind="composite" wide tall scale={0.78}><LoadingScreen /></Tile>
      <Tile name="Game Over" kind="composite" tall scale={0.85}><GameOverScreen /></Tile>
      <Tile name="Save Slots" kind="composite" wide tall scale={0.85}><SaveSlots /></Tile>
    </Section>

    <Section id="inventory" num="IV" title="Inventory &amp; Items" sub="Wares, gear, and the lust for them">
      <Tile name="Inventory Grid" kind="composite" tall xtall scale={0.85}><InventoryGrid /></Tile>
      <Tile name="Paperdoll" kind="composite" tall xtall scale={0.78}><Paperdoll /></Tile>
      <Tile name="Item Tooltip" kind="composite" tall><ItemTooltip /></Tile>
      <Tile name="Shop Panel" kind="composite" wide tall xtall scale={0.85}><ShopPanel /></Tile>
    </Section>

    <Section id="progression" num="V" title="Progression &amp; Social" sub="Climb, fellowship, ceremony">
      <Tile name="Level Header" kind="composite" wide><LevelHeader /></Tile>
      <Tile name="Skill Tree" kind="composite" wide tall xtall scale={0.85}><SkillTree /></Tile>
      <Tile name="Party Panel" kind="composite" tall><PartyPanel /></Tile>
      <Tile name="Achievement Toast" kind="composite" wide><AchievementToast /></Tile>
      <Tile name="Chat Window" kind="composite" tall><ChatWindow /></Tile>
      <Tile name="Radial / Ping Wheel" kind="composite" tall><RadialWheel /></Tile>
    </Section>

    <Section id="settings" num="VI" title="Settings &amp; Controls" sub="Auspices, glyphs of command">
      <Tile name="Settings Panel" kind="composite" wide tall xtall scale={0.82}><SettingsPanel /></Tile>
      <Tile name="Key Bindings" kind="composite" tall xtall scale={0.85}><KeyBindList /></Tile>
    </Section>

    <footer style={{ textAlign: "center", marginTop: 80, paddingTop: 30, borderTop: "1px solid rgba(201,169,97,0.2)", color: "var(--fg-parch-dim)", fontFamily: "var(--fg-mono)", fontSize: 11, letterSpacing: "0.2em", textTransform: "uppercase" }}>
      End of Codex · v 1.04.7 · Build 8821
    </footer>
  </div>
);

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
