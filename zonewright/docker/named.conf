// named.conf for the zonewright image: an authoritative-only BIND 9 that
// serves exactly the zones zonewright writes. No recursion — this is not a
// resolver, and an open resolver is an amplification-attack magnet.
options {
    directory "/var/bind";
    pid-file "/run/named/named.pid";

    listen-on { any; };
    listen-on-v6 { any; };

    recursion no;
    allow-recursion { none; };
    allow-query { any; };
    // Per-zone allow-transfer comes from zonewright (default none).
    allow-transfer { none; };
    notify yes;

    // Don't advertise the server's version or identity.
    version none;
    hostname none;
    server-id none;

    dnssec-validation no;

    // An internet-facing authoritative server is a reflection/amplification
    // target: spoofed-source queries for large answers (ANY, big TXT). RRL
    // caps identical responses per client netblock (slipping every 2nd as a
    // truncated reply so real resolvers retry over TCP), and minimal-any
    // answers ANY with a single RRset.
    rate-limit {
        responses-per-second 10;
        window 5;
        slip 2;
    };
    minimal-any yes;
    minimal-responses yes;
};

// rndc control channel, loopback only. The key is generated per container by
// the entrypoint; the zonewright daemon (group named) reads it to run
// `rndc reload`.
include "/etc/bind/rndc.key";
controls {
    inet 127.0.0.1 port 953 allow { 127.0.0.1; } keys { "rndc-key"; };
};

// The zone list zonewright renders (bind.conf_file).
include "/var/lib/zonewright/named.zones.conf";
